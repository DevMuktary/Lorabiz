name: Build and Deploy to Coolify

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deployment Webhook
        if: env.COOLIFY_WEBHOOK != ''
        continue-on-error: true
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          echo "Triggering Coolify deployment webhook..."
          if [ -n "$COOLIFY_TOKEN" ]; then
            curl -f -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "${{ secrets.COOLIFY_WEBHOOK_URL }}" || curl -f -X GET -H "Authorization: Bearer $COOLIFY_TOKEN" "${{ secrets.COOLIFY_WEBHOOK_URL }}" || true
          else
            curl -f -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" || curl -f -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" || true
          fi
          echo "Coolify deployment trigger finished!"
