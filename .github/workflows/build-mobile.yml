name: Build Mobile Apps (iOS IPA)

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab
  push:
    branches:
      - Mobile-app
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile.yml"

jobs:
  build-ios-ipa:
    name: Build iOS IPA (Sideloadly Ready)
    runs-on: macos-14
    env:
      CI: 1
      EXPO_NON_INTERACTIVE: 1
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -switch /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci --legacy-peer-deps

      - name: Expo Prebuild (Generate Native iOS Project)
        working-directory: ./mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ./mobile
        run: |
          echo "=== CocoaPods Environment ==="
          ruby -v
          which pod || true
          pod --version || true
          echo "=== Installing Pods via npx pod-install ==="
          npx pod-install --non-interactive || {
            echo "npx pod-install had issues, retrying pod install with verbose logs directly in ios directory..."
            cd ios
            pod install --verbose
          }

      - name: Build Xcode Release Binary (Ad-Hoc Signed for Sideloadly)
        working-directory: ./mobile/ios
        run: |
          echo "=== Workspace schemes ==="
          xcodebuild -workspace Lorabiz.xcworkspace -list || true
          echo "=== Compiling Release Build with Ad-Hoc Signing ==="
          xcodebuild -workspace Lorabiz.xcworkspace \
            -scheme Lorabiz \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE="Manual" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee xcodebuild.log || {
              echo "=== XCODEBUILD ERROR LOG (LAST 100 LINES) ==="
              tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Package IPA for Sideloadly / AltStore
        working-directory: ./mobile/ios
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | grep Release-iphoneos | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Found app bundle at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Lorabiz.ipa Payload/
          ls -lh Lorabiz.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lorabiz-iOS-Sideloadly-IPA
          path: mobile/ios/Lorabiz.ipa
          retention-days: 14

# Android build disabled per user request to save time and focus 100% on iOS IPA build.
# - build-android-apk

